<!-- Self-contained on purpose: Pages serves this file for ANY missing path,
     so a relative stylesheet link would resolve against whatever nonsense
     path the visitor mistyped. Everything is inline and every link out is
     absolute. -->
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;padding:24px;
    background:#1b66c2;color:#fdfaf3;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
  .badge{width:74px;height:74px;margin:0 auto 26px;display:block}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;
    font-size:clamp(3.4rem,10vw,5.5rem);line-height:1;color:#f8cd52;letter-spacing:-.02em}
  .k{font-family:Georgia,serif;font-style:italic;font-size:1.25rem;margin:14px 0 6px;color:#fdfaf3}
  p{color:#e6f0fc;max-width:44ch;margin-inline:auto}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:30px 0 38px}
  a.btn{display:inline-block;padding:.9em 1.8em;border-radius:6px;font-weight:700;
    font-size:.94rem;text-decoration:none;letter-spacing:.03em}
  a.gold{background:#e8ad0a;color:#1d1502}
  a.gold:hover{background:#f4bd24}
  a.line{border:1.5px solid rgba(246,230,189,.45);color:#fdfaf3}
  a.line:hover{border-color:#dcb04a;color:#f8cd52}
  a:focus-visible{outline:3px solid #fdfaf3;outline-offset:2px;box-shadow:0 0 0 6px #b8890a}
  .fine{font-size:.8rem;color:#d3e5f9}
  .fine a{color:#f8cd52;text-decoration:none}
  .fine a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <svg class="badge" viewBox="0 0 100 100" aria-hidden="true">

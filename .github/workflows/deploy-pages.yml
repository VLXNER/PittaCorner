name: Deploy site to GitHub Pages

# Deploys from this branch rather than main: the github-pages environment's
# deployment branch policy was pinned to this branch (it was the repository
# default when Pages was first enabled), so main is rejected at the gate.
on:
  push:
    branches: [claude/pitts-corner-website-ddxwpr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `enablement` here - Pages is already on, and creating the site
      # needs admin rights the Actions token does not have.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Plain static files at the repo root - no build step.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
